name: Laravel CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      APP_KEY: base64:base64:wz01/G+zW4fQ4q2p6tX3LhRz6w9v1u4k5j8h7g6f5d=

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, bcmath, sqlite3

      - name: Debug and Copy .env
        run: |
          ls -la
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo ".env.example not found, creating empty .env"
            touch .env
          fi

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate Key
        run: php artisan key:generate

      - name: Run Tests
        run: php artisan test
